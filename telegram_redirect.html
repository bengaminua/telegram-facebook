<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram канал</title>
  <meta name="description" content="Перейти до Telegram каналу">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }
    .card {
      width: min(460px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #229ED9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 38px;
    }
    h1 { margin: 0 0 10px; font-size: 27px; }
    p { margin: 0 0 26px; color: #666; line-height: 1.5; }
    a {
      display: block;
      text-decoration: none;
      background: #229ED9;
      color: #fff;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
    }
    .note { margin-top: 16px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">➤</div>
    <h1>Наш Telegram-канал</h1>
    <p>Натисніть кнопку нижче, щоб перейти до каналу.</p>
    <a href="https://t.me/+yqVLNU3zNLc1Mjky">Перейти в Telegram</a>
    <div class="note">Канал приватний. Для доступу потрібне запрошення.</div>
  </main>
</body>
</html>
