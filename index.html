<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram канал</title>
  <meta name="description" content="Перейти до Telegram каналу">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 45%, #0088CC 100%);
      color: #111;
      position: relative;
      overflow: hidden;
    }

    /* декоративні кола на фоні */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    body::before {
      width: 420px; height: 420px;
      top: -140px; left: -140px;
    }
    body::after {
      width: 320px; height: 320px;
      bottom: -120px; right: -100px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(440px, 100%);
      background: #ffffff;
      border-radius: 28px;
      padding: 44px 30px 34px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,40,70,.35);
      animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #34B7F1, #229ED9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(34,158,217,.45);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 10px 24px rgba(34,158,217,.45); }
      50%      { box-shadow: 0 10px 30px rgba(34,158,217,.7); }
    }

    .icon-wrap svg { width: 40px; height: 40px; }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    p {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.55;
      font-size: 15px;
    }

    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, #34B7F1, #0088CC);
      color: #fff;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 12px 26px rgba(0,136,204,.35);
    }

    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(0,136,204,.45);
    }

    a.btn:active {
      transform: translateY(0px) scale(.98);
    }

    a.btn svg { width: 18px; height: 18px; }

    .note {
      margin-top: 18px;
      font-size: 12.5px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .note svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.5 3.5L2.5 11.2c-1.1.45-1.1 1.2-.2 1.5l4.9 1.53 1.9 5.85c.23.63.4.88.82.88.4 0 .58-.18.8-.4l1.9-1.85 4.05 3c.75.42 1.28.2 1.47-.7l2.66-12.55c.28-1.15-.42-1.66-1.5-1.16z" fill="#fff"/>
      </svg>
    </div>
    <h1>Наш Telegram-канал</h1>
    <p>Натисніть кнопку нижче, щоб перейти до каналу.</p>
    <a class="btn" href="https://t.me/+v8mOjsXKs740ZWMy">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.5 3.5L2.5 11.2c-1.1.45-1.1 1.2-.2 1.5l4.9 1.53 1.9 5.85c.23.63.4.88.82.88.4 0 .58-.18.8-.4l1.9-1.85 4.05 3c.75.42 1.28.2 1.47-.7l2.66-12.55c.28-1.15-.42-1.66-1.5-1.16z" fill="#fff"/>
      </svg>
      Перейти в Telegram
    </a>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Канал приватний. Для доступу потрібне запрошення.
    </div>
  </main>
</body>
</html>
